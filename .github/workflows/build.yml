name: iOS Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Create Xcode project
        run: |
          echo "Xcode project generation needs an actual .xcodeproj."
          echo "Next step: add the Xcode project structure."

      - name: List files
        run: find . -maxdepth 3 -type f
