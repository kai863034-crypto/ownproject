name: iOS IPA Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Current directory:"
          pwd

          echo "Repository files:"
          ls -la

          echo "FreeFireFileManager folder:"
          ls -la FreeFireFileManager

          echo "Xcode project:"
          ls -la FreeFireFileManager.xcodeproj

          test -f FreeFireFileManager/FreeFireFileManagerApp.swift
          test -f FreeFireFileManager/ContentView.swift

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project FreeFireFileManager.xcodeproj \
            -scheme FreeFireFileManager \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/FreeFireFileManager.app Payload/
          zip -r FreeFireFileManager-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeFireFileManager-unsigned-ipa
          path: FreeFireFileManager-unsigned.ipa
