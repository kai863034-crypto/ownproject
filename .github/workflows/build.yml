name: iOS IPA Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build iOS App
        run: |
          xcodebuild \
            -project FreeFireFileManager.xcodeproj \
            -scheme FreeFireFileManager \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/FreeFireFileManager.app Payload/
          zip -r FreeFireFileManager.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FreeFireFileManager-IPA
          path: FreeFireFileManager.ipa
